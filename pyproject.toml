[project]
name = "statement_of_account"
authors = [
    { name = "Iftikhar Hussain Syed", email = "iftikhar.hussain@cvshvac.com" }
]
description = "Customer Statement of Account report (Accounts Receivable data with PDC/LC and Project Wise Summary) for CVS HVAC"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 110
target-version = "py310"
